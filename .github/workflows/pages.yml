name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - app/src-tauri/icons/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site uses the README images and the app icon instead of keeping copies.
      - name: Assemble
        run: |
          cp -r site _site
          cp -r docs/images _site/images
          cp app/src-tauri/icons/32x32.png _site/favicon-32.png
          cp app/src-tauri/icons/128x128@2x.png _site/apple-touch-icon.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
