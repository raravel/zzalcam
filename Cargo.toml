[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/raravel/zzalcam"

[workspace.dependencies]
zzalcam-core = { path = "crates/zzalcam-core" }
zzalcam-encode = { path = "crates/zzalcam-encode" }
zzalcam-capture = { path = "crates/zzalcam-capture" }
anyhow = "1"
thiserror = "2"
lz4_flex = "0.14"
rayon = "1"
imagequant = "4"
gif = "0.14"
libwebp-sys = "0.14"
clap = { version = "4", features = ["derive"] }
windows = "0.62"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

# imagequant trips a debug-only assertion on near-zero histogram weights; release builds are unaffected.
[profile.dev.package.imagequant]
debug-assertions = false
