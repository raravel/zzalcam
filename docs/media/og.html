<!doctype html>
<!-- The 1200×630 link preview image of the website (site/og.png); see README.md here. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
    color: #fff;
    background:
      radial-gradient(60% 80% at 80% 15%, #4f7cff 0%, transparent 60%),
      radial-gradient(70% 90% at 10% 95%, #7a4dff 0%, transparent 60%),
      linear-gradient(135deg, #1a2b6b, #0e1640);
    position: relative;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; }
  .name { font: 700 72px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -1px; }
  .tag { margin-top: 20px; font-size: 30px; line-height: 1.3; font-weight: 600; }
  .ko { margin-top: 10px; font-size: 24px; color: #d6dcf5; word-break: keep-all; }
  .formats { margin-top: 32px; display: flex; gap: 10px; }
  .formats span { padding: 6px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); font-size: 18px; font-weight: 600; }
  .shot { position: absolute; left: 580px; top: 95px; width: 680px; border-radius: 10px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../app/src-tauri/icons/icon.png" alt=""><span class="name">zzalcam</span></div>
    <div class="tag">Fast, small GIF and WebP screen recorder for Windows</div>
    <div class="ko">윈도우용 빠르고 가벼운 GIF·WebP 화면 녹화기</div>
    <div class="formats"><span>GIF</span><span>WebP</span><span>Free · open source</span></div>
  </div>
  <img class="shot" src="../images/editor-en-dark.png" alt="">
</body>
</html>
